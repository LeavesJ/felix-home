<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Held To</title><link rel="stylesheet" href="fig.css"></head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="The same model writes the change. Vibe coding sends it to main once it runs. Engineering sends it through everything owed, an independent check and a record, with a person answering for it.">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#a8a7a0" stroke-width="1.6"/></marker></defs>

  <g class="human"><rect x="70" y="468" width="160" height="64" rx="32"/><text class="lbl" x="150" y="500">Prompt</text></g>
  <path class="arr" d="M238,500 L322,500" marker-end="url(#a)"/>
  <g class="model"><rect x="330" y="468" width="160" height="64" rx="2"/><text class="lbl" x="410" y="500">Model</text></g>
  <path class="arr" d="M498,500 L582,500" marker-end="url(#a)"/>
  <g class="node"><rect x="590" y="468" width="160" height="64" rx="2"/><text class="lbl" x="670" y="500">Change</text></g>

  <!-- vibe coding lane -->
  <text class="sm" x="1170" y="236" style="font-style:italic">vibe coding</text>
  <path class="arr" d="M758,486 C850,420 900,300 1062,300" marker-end="url(#a)"/>
  <g class="node"><rect x="1070" y="268" width="200" height="64" rx="2"/><text class="lbl" x="1170" y="300">Does it run?</text></g>
  <path class="arr" d="M1278,300 C1400,300 1450,380 1456,458" marker-end="url(#a)"/>

  <!-- engineering lane -->
  <text class="sm" x="1020" y="636" style="font-style:italic">engineering</text>
  <path class="arr" d="M758,514 C800,600 820,700 852,700" marker-end="url(#a)"/>
  <g class="node"><rect x="860" y="668" width="200" height="64" rx="2"/><text class="lbl" x="960" y="700">What is owed</text></g>
  <text class="sm" x="960" y="770">incl. what nobody asked for</text>
  <path class="arr" d="M1068,700 L1112,700" marker-end="url(#a)"/>
  <g class="node"><rect x="1120" y="668" width="150" height="64" rx="2"/><text class="lbl" x="1195" y="700">Check</text></g>
  <text class="sm" x="1195" y="770">not the author's,</text>
  <text class="sm" x="1195" y="798">seen to fail</text>
  <path class="arr" d="M1278,700 C1380,700 1440,640 1456,542" marker-end="url(#a)"/>

  <path class="arr dash" d="M1195,812 L1195,846" marker-end="url(#a)"/>
  <g class="node"><rect x="1120" y="852" width="150" height="56" rx="2"/><text class="lbl" x="1195" y="880">Record</text></g>
  <path class="arr dash" d="M1278,880 L1322,880"/>
  <g class="human"><rect x="1330" y="852" width="130" height="56" rx="28"/><text class="lbl" x="1395" y="880">Owner</text></g>

  <g><rect x="1420" y="468" width="140" height="64" rx="32" fill="#2b2a27"/><text class="lbl" x="1490" y="500" style="fill:#fff">main</text></g>

  <text class="cap" x="70" y="970"><tspan class="b">Fig. 1</tspan>  The same model writes the change. The difference is what it is held to on the way to main.</text>
</svg>
</body></html>

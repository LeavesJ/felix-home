<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Three Rings</title><link rel="stylesheet" href="fig.css"></head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Nested regions: what the agent thinks it needs, inside what the work requires, inside what nobody knew to look for. Rate limiting sits in the outer region.">
  <ellipse cx="800" cy="470" rx="720" ry="400" fill="#fdf6f2" stroke="#e7a58c" stroke-width="2" stroke-dasharray="8 8"/>
  <ellipse cx="740" cy="500" rx="480" ry="280" fill="#f3f2fc" stroke="#b3aee6" stroke-width="2"/>
  <ellipse cx="690" cy="530" rx="260" ry="150" fill="#eff7eb" stroke="#a9d19a" stroke-width="2"/>

  <text class="sm" x="800" y="120" style="fill:#c4552c">what nobody knew to look for</text>
  <text class="sm" x="740" y="268" style="fill:#5a52b8">what the work requires</text>
  <text class="sm" x="690" y="440" style="fill:#4d8a39">what the agent thinks it needs</text>

  <g font-size="22" text-anchor="middle">
    <text x="690" y="530" style="fill:#2b2a27">the feature</text>
    <text x="690" y="566" style="fill:#2b2a27">its own tests</text>
    <text x="470" y="360" style="fill:#2b2a27">the gate</text>
    <text x="1020" y="380" style="fill:#2b2a27">what it exposes</text>
    <text x="1010" y="680" style="fill:#2b2a27">how mature it is</text>
  </g>

  <circle cx="1340" cy="560" r="9" fill="#c4552c"/>
  <text x="1362" y="568" font-size="24" font-weight="600" style="fill:#c4552c">rate limiting</text>
  <circle cx="230" cy="600" r="7" fill="none" stroke="#c4552c" stroke-width="2"/>
  <circle cx="300" cy="760" r="7" fill="none" stroke="#c4552c" stroke-width="2"/>
  <text x="252" y="608" font-size="22" style="fill:#8a8983">?</text>
  <text x="322" y="768" font-size="22" style="fill:#8a8983">?</text>

  <text class="cap" x="70" y="960"><tspan class="b">Fig. 2</tspan>  Rate limiting sat in the outer ring. The model, my first design, a hand-written checklist and I all missed it.</text>
</svg>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Branches</title><link rel="stylesheet" href="fig.css"></head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Git graph: a person sets intent, Felix keeps what the project owes and sets the check on each branch; agents work on branches; two merge through checks, one is held.">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#a8a7a0" stroke-width="1.6"/></marker>
  <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#b3aee6" stroke-width="1.6"/></marker></defs>

  <g class="human"><rect x="70" y="72" width="130" height="64" rx="32"/><text class="lbl" x="135" y="104">You</text></g>
  <text class="sm" x="135" y="170">what, and why</text>
  <path class="arr" d="M208,104 L292,104" marker-end="url(#a)"/>
  <g class="felix"><rect x="300" y="72" width="300" height="64" rx="2"/><text class="lbl" x="450" y="104">Felix</text></g>
  <text class="sm" x="450" y="170">what this project owes</text>

  <!-- record sets the checks -->
  <g stroke="#b3aee6" stroke-width="2" stroke-dasharray="7 7" fill="none">
    <path d="M560,140 C700,260 760,520 760,646" marker-end="url(#p)"/>
    <path d="M590,128 C900,200 1080,480 1100,646" marker-end="url(#p)"/>
    <path d="M600,112 C1060,140 1300,420 1320,646" marker-end="url(#p)"/>
  </g>

  <!-- main -->
  <line x1="70" y1="760" x2="1540" y2="760" stroke="#4a4945" stroke-width="3"/>
  <g fill="#4a4945"><circle cx="150" cy="760" r="8"/><circle cx="300" cy="760" r="8"/><circle cx="760" cy="760" r="8"/><circle cx="1100" cy="760" r="8"/><circle cx="1150" cy="760" r="8"/></g>
  <text x="70" y="808" font-size="24" font-weight="600">main</text>

  <!-- branches: agents -->
  <g fill="none" stroke="#fff" stroke-width="10">
    <path d="M150,760 C150,620 180,560 240,560 L640,560 C720,560 760,640 760,700"/>
  </g>
  <g fill="none" stroke="#7fb86c" stroke-width="3">
    <path d="M150,760 C150,620 180,560 240,560 L640,560 C720,560 760,640 760,700"/>
    <path d="M300,760 C300,560 340,420 420,420 L960,420 C1060,420 1100,600 1100,700"/>
    <path d="M1150,760 C1150,640 1180,560 1230,560 L1250,560 C1300,560 1320,620 1320,668"/>
  </g>
  <g font-size="22" style="fill:#4d8a39">
    <text x="260" y="545">agent</text>
    <text x="440" y="405">agent, another model</text>
    <text x="1200" y="545">agent</text>
  </g>

  <!-- checks -->
  <g class="node"><rect x="728" y="660" width="64" height="44" rx="2"/></g>
  <path d="M746,682 l10,10 l18,-20" stroke="#4a4945" stroke-width="2.5" fill="none"/>
  <g class="node"><rect x="1068" y="660" width="64" height="44" rx="2"/></g>
  <path d="M1086,682 l10,10 l18,-20" stroke="#4a4945" stroke-width="2.5" fill="none"/>
  <g><rect x="1288" y="660" width="64" height="44" rx="2" fill="#fcefe9" stroke="#e7a58c" stroke-width="2"/></g>
  <path d="M1310,672 l20,20 M1330,672 l-20,20" stroke="#c4552c" stroke-width="2.5"/>
  <text x="1372" y="636" font-size="22" font-weight="600" style="fill:#c4552c">held</text>
  <text x="1372" y="666" font-size="22" style="fill:#8a8983">owes something</text>
  <text x="1372" y="694" font-size="22" style="fill:#8a8983">it didn't do</text>

  <text class="cap" x="70" y="960"><tspan class="b">Fig. 3</tspan>  Agents do the work on branches. What each change owes comes from the project, and a check, not a model, decides what merges.</text>
</svg>
</body></html>

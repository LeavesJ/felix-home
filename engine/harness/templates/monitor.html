<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felix — what it is telling Claude</title>
<style>
:root{
  --void:#05080b; --panel:rgba(10,20,26,.55); --panel-2:rgba(7,14,19,.35);
  --ice:#7fe9e2; --ice-dim:#3d8a86; --ice-ghost:rgba(127,233,226,.09);
  --amber:#f2b25c; --jade:#6ee7a5; --crimson:#ff6b7a;
  --bone:#e8f2f2; --ash:#8ba2a4; --ash-dim:#4b5f62;
  --rule:rgba(127,233,226,.15);
  --mono:"SF Mono",SFMono-Regular,Menlo,Monaco,"Courier New",monospace;
  --face:Futura,"Avenir Next Condensed","Avenir Next",Optima,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--mono);font-size:13px;
  line-height:1.65;overflow:hidden;-webkit-font-smoothing:antialiased}
.atmo,.grain{position:fixed;inset:0;pointer-events:none;z-index:0}
.atmo{background:
  radial-gradient(46vw 46vw at 14% 46%, rgba(28,104,104,.20), transparent 62%),
  radial-gradient(40vw 40vw at 92% 8%, rgba(120,86,30,.05), transparent 64%)}
.grain{opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.6'/></svg>")}

.shell{position:relative;z-index:2;height:100vh;display:grid;
  grid-template-rows:auto auto 1fr auto;padding:16px 24px 0}

header{display:flex;align-items:center;gap:16px;
  padding-bottom:12px;border-bottom:1px solid var(--rule)}
.mark{font-family:var(--face);font-size:20px;letter-spacing:.42em;color:var(--ice);
  text-transform:uppercase;line-height:1;padding-left:11px;border-left:2px solid var(--ice);
  text-shadow:0 0 20px rgba(127,233,226,.4)}
.lede{color:var(--ash);font-size:12px}
header .sp{flex:1}
.pbtn{font-family:var(--face);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  padding:6px 13px;background:transparent;border:1px solid var(--rule);color:var(--ash);
  cursor:pointer;border-radius:7px;transition:.18s}
.pbtn:hover{color:var(--bone);border-color:var(--ice-dim)}
.pbtn[aria-pressed="true"]{background:var(--ice-ghost);color:var(--ice);border-color:var(--ice-dim)}
.pbtn.live[aria-pressed="true"]{color:var(--jade);border-color:rgba(110,231,165,.5);
  background:rgba(110,231,165,.08)}

/* ---- the ball, centred, with the numbers under it ---- */
.rail{display:grid;justify-items:center;gap:10px;padding:14px 0 4px}
.orb{position:relative;width:min(34vh,290px);height:min(34vh,290px);display:grid;place-items:center}
.orb canvas{position:absolute;inset:0;width:100%;height:100%}
.orbText{position:relative;text-align:center;pointer-events:none}
.orbText .n{font-family:var(--face);font-size:clamp(17px,2.3vh,24px);letter-spacing:.26em;
  text-transform:uppercase;color:var(--ice);text-shadow:0 0 22px rgba(127,233,226,.45)}
.orbText .s{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--ash-dim);margin-top:6px}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(74px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.vital{background:rgba(7,14,19,.7);padding:9px 10px;text-align:center}
.vital .k{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash-dim)}
.vital .v{font-family:var(--face);font-size:19px;color:var(--bone);line-height:1.25}
.vital.bad .v{color:var(--crimson)} .vital.good .v{color:var(--jade)}

/* ---- the chat: one line each, opened only if you want the words ---- */
.feed{min-height:0;overflow:auto;padding:10px 0 14px;scroll-behavior:smooth;
  width:100%;max-width:760px;justify-self:center}
.feed::-webkit-scrollbar{width:7px}
.feed::-webkit-scrollbar-thumb{background:var(--ash-dim);border-radius:4px}
.turn{margin-bottom:9px;animation:rise .45s cubic-bezier(.16,.84,.44,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.said{margin:0 0 5px 2px}
.you{color:var(--ash-dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-style:italic}
.you b{font-weight:400;font-style:normal;letter-spacing:.12em;text-transform:uppercase;
  font-size:9px;color:var(--ash-dim);opacity:.75}

.msg{border:1px solid var(--rule);border-left:2px solid var(--ice-dim);border-radius:8px;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));overflow:hidden}
.msg.held{border-left-color:var(--crimson)}
.msg.note,.msg.skipped{border-left-color:var(--amber)}
.msg.plugin-blocked{border-left-color:var(--crimson)}
.msg .hd{display:flex;align-items:center;gap:11px;padding:9px 14px;cursor:pointer;
  transition:background .15s}
.msg .hd:hover{background:rgba(127,233,226,.05)}
.msg .gist{color:var(--bone);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1}
.msg .caret{color:var(--ash-dim);font-size:10px;transition:transform .2s}
.msg[data-open="1"] .caret{transform:rotate(90deg)}
.msg[data-open="1"] .hd{border-bottom:1px solid rgba(127,233,226,.10);background:rgba(0,0,0,.22)}
.badge{font-family:var(--face);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ice);border:1px solid var(--ice-dim);border-radius:4px;padding:2px 8px}
.badge.held,.badge.plugin-blocked{color:var(--crimson);border-color:rgba(255,107,122,.5)}
.badge.note,.badge.skipped{color:var(--amber);border-color:rgba(242,178,92,.5)}
.hd .tm{color:var(--ash-dim);font-size:10px}
.msg pre{margin:0;padding:12px 16px;white-space:pre-wrap;word-break:break-word;
  font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--bone)}
.msg pre em{color:var(--ice);font-style:normal}
.msg pre b{color:var(--amber);font-weight:400}

.empty{color:var(--ash-dim);padding:40px 6px;font-size:12px}
.empty code{color:var(--ice)}

footer{border-top:1px solid var(--rule);padding:9px 0 11px;
  display:flex;align-items:center;gap:16px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ash-dim);margin-top:12px}
footer .sp{flex:1}
footer .hot{color:var(--ice)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--jade);display:inline-block;
  margin-right:7px;box-shadow:0 0 9px var(--jade)}
.dot.idle{background:var(--ash-dim);box-shadow:none}

@media(max-width:900px){
  body{overflow:auto}
  .shell{height:auto;min-height:100vh;grid-template-columns:1fr}
  .orb{min-height:44vw}
  .feed{overflow:visible}
}
@media(prefers-reduced-motion:reduce){.turn{animation:none}}
</style>
</head>
<body>
<div class="atmo"></div><div class="grain"></div>

<div class="shell">
  <header>
    <div class="mark">Felix</div>
    <div class="lede">what it is telling Claude · click a line for the words</div>
    <div class="sp"></div>
    <div id="projs" style="display:flex;gap:6px"></div>
    <button class="pbtn live" id="liveBtn" aria-pressed="false">live</button>
  </header>

  <div class="rail">
    <div class="orb">
      <canvas id="orb"></canvas>
      <div class="orbText">
        <div class="n" id="orbName">quiet</div>
        <div class="s" id="orbSub">nothing said yet</div>
      </div>
    </div>
    <div class="vitals" id="vitals"></div>
  </div>

  <div class="feed" id="feed"></div>

  <footer>
    <span><span class="dot idle" id="liveDot"></span><span id="stamp"></span></span>
    <span class="sp"></span>
    <span id="hint">re-run <span class="hot">felix monitor</span> to refresh</span>
  </footer>
</div>

<script>
/* The marker sits alone as the whole value. An earlier version left a literal
   after it, so substitution produced `const DATA = {...} null;` — a syntax
   error on the first line that killed the script silently. */
const DATA =
/*{{FELIX_DATA}}*/
;

/* Everything reaches the page through textContent. Felix quotes back whatever
   was typed into a session, so treating any of it as markup would turn a prompt
   into script on a page about governance. Nothing here uses innerHTML. */
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined && x !== null) n.textContent = String(x); return n; };
const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
const at = id => document.getElementById(id);

const D = (DATA && DATA.projects) ? DATA : { generated:'', projects:[] };
const S = { proj:0 };
const cur = () => D.projects[S.proj] || { name:'—', says:[], routeLog:[], verifyLog:[], lessons:0 };
const hhmm = t => String(t||'').replace(/^.*T/,'').replace('Z','').slice(0,5);
const stamp = t => Date.parse(String(t||'')) || 0;

/* The log escapes newlines so a record stays greppable on one line. Undo that
   here, because the whole point is showing it as Claude received it. */
const unesc = s => String(s||'').replace(/\\n/g, '\n').replace(/\\\\/g, '\\');

/* What caused an utterance is recorded alongside it, not inferred. Pairing by
   nearest timestamp was the first attempt and it lied: two prompts in the same
   second are indistinguishable, and the page cheerfully attributed a frontend
   briefing to a question about permutation tests. */

/* ------------------------------------------------------------------ orb -- */
const cv = at('orb'), cx = cv.getContext('2d');
const HUES = { calm:[127,233,226], warn:[242,178,92], bad:[255,107,122] };
let P = [], W = 0, H = 0, spin = 0, mood = 'calm', agitation = 0, speaking = 0;

function seed(n){ P = [];
  for (let i = 0; i < n; i++){
    const y = 1 - (i/(n-1))*2, r = Math.sqrt(Math.max(0, 1-y*y));
    const th = Math.PI*(3-Math.sqrt(5))*i;
    P.push({x:Math.cos(th)*r, y:y, z:Math.sin(th)*r, j:Math.random()*Math.PI*2});
  } }
function fit(){ const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = Math.max(1,W*d); cv.height = Math.max(1,H*d);
  cx.setTransform(d,0,0,d,0,0); }
function draw(t){
  cx.clearRect(0,0,W,H);
  const px = W/2, py = H/2, R = Math.min(W,H)*0.29;
  const c = HUES[mood], rgb = a => 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
  spin += 0.0014 + agitation*0.004;
  const arcs = [
    {r:R*1.16, from:-0.9, len:2.1, w:1.5, a:.50, s: 0.9},
    {r:R*1.16, from: 2.0, len:0.7, w:1.5, a:.26, s: 0.9},
    {r:R*1.42, from: 1.1, len:2.6, w:1.0, a:.24, s:-0.5},
    {r:R*1.66, from: 0.4, len:1.2, w:0.8, a:.12, s: 0.3}
  ];
  arcs.forEach(g => { cx.save(); cx.translate(px,py); cx.rotate(t*0.00012*g.s);
    cx.strokeStyle = rgb(g.a); cx.lineWidth = g.w; cx.lineCap='round';
    cx.beginPath(); cx.arc(0,0,g.r,g.from,g.from+g.len); cx.stroke(); cx.restore(); });
  const ma = t*0.00042, mx = px+Math.cos(ma)*R*1.16, my = py+Math.sin(ma)*R*1.16;
  const mg = cx.createRadialGradient(mx,my,0,mx,my,9);
  mg.addColorStop(0,rgb(.9)); mg.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle = mg; cx.beginPath(); cx.arc(mx,my,9,0,Math.PI*2); cx.fill();
  const sn = Math.sin(spin), cs = Math.cos(spin), tilt = .42;
  for (const p of P){
    const x1 = p.x*cs+p.z*sn, z1 = -p.x*sn+p.z*cs;
    const y1 = p.y*Math.cos(tilt)-z1*Math.sin(tilt);
    const z2 = p.y*Math.sin(tilt)+z1*Math.cos(tilt);
    const br = 1 + Math.sin(t*0.001+p.j)*(0.02+agitation*0.05+speaking*0.06);
    const depth = (z2+1)/2;
    cx.fillStyle = rgb(0.05+depth*(0.34+speaking*0.3));
    cx.beginPath(); cx.arc(px+x1*R*br, py+y1*R*br, 0.4+depth*1.1, 0, Math.PI*2); cx.fill();
  }
  if (speaking > 0) speaking = Math.max(0, speaking - 0.012);
  requestAnimationFrame(draw);
}

/* ---------------------------------------------------------------- render -- */
const LABEL = { brief:'routed', held:'held', skipped:'flagged',
                'plugin-blocked':'alarm', unrecorded:'note' };

/* One line saying what it did. Somebody using an agent to write code does not
   want a transcript of everything their governance layer whispered; they want
   to know it routed to frontend and asked for the design skill. The words are
   kept in full and shown on a click, because the whole reason this page exists
   is that they were previously unavailable at all. */
function gist(s){
  const t = unesc(s.text), line = n => (t.split('\n')[n] || '').trim();
  if (s.kind === 'brief'){
    const to = (t.match(/routed this to:\s*(\S+)/) || [])[1];
    const use = (t.match(/Use this now:\s*([^\n(]+)/) || [])[1];
    const lessons = (t.match(/Lessons this project/) ? ' + lessons' : '');
    if (to && use) return to + ' · use ' + use.trim() + lessons;
    if (to) return to + lessons;
    return 'mounted lessons';
  }
  if (s.kind === 'held'){
    if (/never run/.test(t)) return 'held it back — the tests have never run here';
    if (/failed on this exact/.test(t)) return 'held it back — the tests failed on this version';
    return 'held it back — the code changed since the tests ran';
  }
  if (s.kind === 'skipped'){
    const w = (t.match(/asks for\n?([^,\n]+)/) || [])[1];
    return 'flagged a step never taken' + (w ? ' — ' + w.trim() : '');
  }
  if (s.kind === 'plugin-blocked'){
    const n = (t.match(/blocked (\d+) tool/) || [])[1];
    const who = (t.match(/from\s+the\s+(\S+)\s+plugin/) || [])[1];
    return (who ? who + ' ' : 'a plugin ') + 'blocked ' + (n || 'some') + ' of your tool calls';
  }
  if (s.kind === 'unrecorded') return 'asked for a note on what the gate caught';
  return line(0);
}

function renderFeed(){
  const p = cur(), box = clear(at('feed'));
  const says = p.says || [], asks = p.routeLog || [];
  if (!says.length){
    const e = el('div','empty');
    e.appendChild(el('div', null, 'Felix has not said anything in this project yet.'));
    const c = el('div'); c.appendChild(el('span', null, 'Work in it and this fills with every word it sends to Claude. Turn on '));
    c.appendChild(el('code', null, 'live')); c.appendChild(el('span', null, ' with felix monitor --watch running.'));
    e.appendChild(c); box.appendChild(e); return;
  }
  says.forEach((s, i) => {
    const turn = el('div','turn');
    turn.style.animationDelay = Math.min(i,10)*0.03 + 's';
    if (s.cause){
      const line = el('div','said');
      const y = el('div','you'); y.appendChild(el('b', null, 'you said\u00a0'));
      y.appendChild(el('span', null, s.cause));
      line.appendChild(y); turn.appendChild(line);
    }
    const kind = s.kind || 'brief';
    const msg = el('div','msg ' + kind);
    msg.dataset.open = '0';
    const hd = el('div','hd');
    hd.appendChild(el('span','caret','\u25B8'));
    hd.appendChild(el('span','badge ' + kind, LABEL[kind] || kind));
    hd.appendChild(el('span','gist', gist(s)));
    hd.appendChild(el('span','tm', hhmm(s.t)));
    msg.appendChild(hd);
    const pre = el('pre', null, unesc(s.text));
    pre.style.display = 'none';
    msg.appendChild(pre);
    hd.addEventListener('click', () => {
      const open = msg.dataset.open === '1';
      msg.dataset.open = open ? '0' : '1';
      pre.style.display = open ? 'none' : 'block';
    });
    turn.appendChild(msg);
    box.appendChild(turn);
  });
}

function renderVitals(){
  const p = cur(), says = p.says || [], vl = p.verifyLog || [];
  const held = says.filter(s => s.kind === 'held' || s.kind === 'plugin-blocked').length;
  const last = says[0];
  mood = !last ? 'calm' : (last.kind === 'held' || last.kind === 'plugin-blocked') ? 'bad'
       : (last.kind === 'skipped' || last.kind === 'unrecorded') ? 'warn' : 'calm';
  agitation = mood === 'bad' ? 1 : mood === 'warn' ? .4 : 0;

  at('orbName').textContent = last ? (LABEL[last.kind] || last.kind) : 'quiet';
  at('orbName').style.color = mood === 'bad' ? 'var(--crimson)'
                            : mood === 'warn' ? 'var(--amber)' : 'var(--ice)';
  at('orbSub').textContent = last ? hhmm(last.t) : 'nothing said yet';

  const items = [['said', says.length, ''], ['held', held, held ? 'bad' : 'good'],
                 ['notes', p.lessons || 0, '']];
  const box = clear(at('vitals'));
  items.forEach(([k,v,c]) => { const d = el('div','vital' + (c ? ' '+c : ''));
    d.appendChild(el('div','k',k)); d.appendChild(el('div','v',v)); box.appendChild(d); });
}

function renderProjects(){
  const box = clear(at('projs'));
  D.projects.forEach((p,i) => { const b = el('button','pbtn', p.name);
    b.setAttribute('aria-pressed', String(i === S.proj)); b.dataset.p = String(i); box.appendChild(b); });
}
function paint(){ renderProjects(); renderVitals(); renderFeed(); speaking = 1; }

document.addEventListener('click', e => {
  const p = e.target.closest('.pbtn[data-p]');
  if (p){ S.proj = Number(p.dataset.p); paint(); }
});

/* ------------------------------------------------------------------ live -- */
const REFRESH_MS = 4000, KEY = 'felix.monitor.view';
function saveView(){ try { sessionStorage.setItem(KEY, JSON.stringify({
    proj:S.proj, y: at('feed') ? at('feed').scrollTop : 0 })); } catch(e){} }
function restoreView(){ let v = null;
  try { v = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch(e){}
  if (!v) return;
  if (typeof v.proj === 'number' && D.projects[v.proj]) S.proj = v.proj;
  requestAnimationFrame(() => { if (at('feed')) at('feed').scrollTop = v.y || 0; });
}
let live = false, timer = null;
function setLive(on){
  live = !!on;
  try { localStorage.setItem('felix.monitor.live', live ? '1':'0'); } catch(e){}
  at('liveBtn').setAttribute('aria-pressed', String(live));
  at('liveDot').className = 'dot' + (live ? '' : ' idle');
  at('hint').textContent = live
    ? 'listening · refreshes every ' + (REFRESH_MS/1000) + 's · needs felix monitor --watch'
    : 're-run felix monitor to refresh';
  if (timer){ clearTimeout(timer); timer = null; }
  if (live) timer = setTimeout(() => { saveView(); location.reload(); }, REFRESH_MS);
}
at('liveBtn').addEventListener('click', () => setLive(!live));
window.addEventListener('beforeunload', saveView);

at('stamp').textContent = 'snapshot ' + String(D.generated||'').replace('T',' ').replace('Z',' UTC');
restoreView(); seed(300); fit(); paint(); requestAnimationFrame(draw);
window.addEventListener('resize', fit);
try { setLive(localStorage.getItem('felix.monitor.live') === '1'); } catch(e){ setLive(false); }
</script>
</body>
</html>
